
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Two runs, because they test different things. The default run exercises the code
      # against the default library context; the `ossl-context` run installs a library
      # context and restricts the default one to a provider that does not exist, so anything
      # that quietly uses the default context fails. Neither subsumes the other.
      - name: cargo test
        run: cargo test --features vendored
      - name: cargo test (library context)
        run: cargo test --features vendored,ossl-context
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test --doc --features vendored

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check -l
      # These also enforce clippy.toml's ban on rust-openssl APIs that wrap OpenSSL
      # functions deprecated in 3.0, which bypass the provider layer and so never reach
      # the FIPS module. See src/hash.rs's provider-routing test for why that matters.
      - run: cargo clippy --features vendored --all-targets -- -D warnings
      - run: cargo clippy --features vendored --no-default-features --all-targets -- -D warnings
      # The test-only features compile code no other job here lints.
      - run: cargo clippy --features vendored,ossl-context --all-targets -- -D warnings
      # Catches the same functions declared as raw FFI, which clippy cannot see.
      - name: No deprecated OpenSSL APIs
        run: ./ci/check-deprecated-apis.sh

  test-fips-1-1-1:
    name: Test using FIPS openssl 1.1.1
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi8/ubi:latest
    steps:
      - name: Install dependencies
        run: dnf install -y gcc openssl-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Use single thread on FIPS to avoid running out of entropy
      - name: Run cargo test --features fips
        run: cargo test --tests --features fips -- --test-threads=1

  test-fips-openssl-3:
    name: Test using FIPS openssl 3
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: Install dependencies
        run: dnf install -y gcc openssl-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The suite must not pass when the FIPS provider cannot be loaded: `fips::enable()`
      # panics if it cannot, and that has to fail the run rather than leave the process
      # quietly outside the validated module. This image *does* ship the module, so pointing
      # OPENSSL_MODULES at an empty directory is what makes the check mean anything.
      - name: Ensure the suite fails when the FIPS module is unavailable
        run: |
          mkdir -p /tmp/no-fips-module
          ! OPENSSL_MODULES=/tmp/no-fips-module cargo test aes_available --features fips
      - run: OPENSSL_FORCE_FIPS_MODE=1 cargo test --features fips -- --test-threads=1

  test-fips-openssl-3-libctx:
    name: Test FIPS with an application-supplied library context
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: Install dependencies
        run: dnf install -y gcc openssl-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # `fips::enable()` behaves differently once a global library context is set: it loads the
      # providers into *that* context and sets `fips=yes` there, and `fips::enabled()` reads it
      # back from there. That combination is the one an application supplying its own context
      # ends up in, and neither FIPS job above runs it.
      - run: OPENSSL_FORCE_FIPS_MODE=1 cargo test --features fips,ossl-context -- --test-threads=1

  test-no-chacha:
    name: Test using OpenSSL without ChaCha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ci/openssl-custom
          key: openssl-3.2.0-no-chacha-1
        id: openssl-cache
      - name: Build openssl
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: ./ci/build-openssl-custom.sh
      - name: cargo test
        run: |
          OPENSSL_DIR=$GITHUB_WORKSPACE/ci/openssl-custom \
          LD_LIBRARY_PATH=$OPENSSL_DIR/lib64:$LD_LIBRARY_PATH \
          cargo test
      # Now test building against system OpenSSL, but running against the no-ChaCha OpenSSL
      - run: cargo clean
      - run: cargo test --no-run
      - run: |
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/ci/openssl-custom/lib64:$LD_LIBRARY_PATH \
          cargo test

  test-openssl-provider:
    name: Test OpenSSL no-deprecated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ci/openssl-custom
          key: openssl-3.2.0-no-deprecated-1
        id: openssl-cache
      - name: Build openssl
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: OPENSSL_CONFIG_FLAGS="no-deprecated" ./ci/build-openssl-custom.sh
      - name: Use rust-openssl fork that compiles with no-deprecated
        run: |
          cargo rm openssl-sys openssl
          cargo add openssl-sys --git https://github.com/tofay/rust-openssl --branch no-deprecated-openssl-crate
          cargo add openssl --git https://github.com/tofay/rust-openssl --branch no-deprecated-openssl-crate
      - name: cargo test
        run: |
          OPENSSL_DIR=$GITHUB_WORKSPACE/ci/openssl-custom \
          LD_LIBRARY_PATH=$OPENSSL_DIR/lib64:$LD_LIBRARY_PATH \
          cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
